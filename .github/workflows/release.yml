name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --release --locked

  ubuntu:
    needs: test
    # Oldest supported runner, so the binary runs on Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-deb --locked
      - run: cargo deb
      - name: Collect
        run: |
          mkdir dist
          cp target/debian/*.deb dist/
          mkdir combine && cp target/release/combine README.md LICENSE install.sh combine/ && cp -r packaging combine/
          tar -czf "dist/combine-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" combine
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*

  arch:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git libxkbcommon wayland libglvnd xdg-desktop-portal
      - uses: actions/checkout@v5
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder .
          cd packaging && sudo -u builder makepkg -f --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/*.pkg.tar.zst

  release:
    needs: [ubuntu, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
